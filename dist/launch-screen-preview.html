<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch screen — Stockfish AI Chess</title><style>
*{box-sizing:border-box}body{margin:0;background:#dfe1e6;color:#202126;font:14px Arial,sans-serif}main{max-width:520px;margin:20px auto;padding:0 16px}.controls{background:white;border-radius:12px;padding:16px;margin-bottom:18px}h1{font-size:18px;margin:0 0 8px}p{line-height:1.5;margin:8px 0}label{display:flex;align-items:center;gap:12px;margin-top:12px}input{flex:1;min-width:0;accent-color:#1679e9}output{min-width:42px}#stage{position:relative;margin:auto;box-shadow:0 6px 24px #0002;overflow:hidden}#launch{position:absolute;width:440px;height:956px;transform-origin:top left;background:#287ac0;display:grid;place-items:center}#launch img{width:144px;height:144px;display:block}small{display:block;color:#62636b;line-height:1.5;margin-top:10px}.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}a{color:#145caa}
</style></head><body><main><section class="controls"><h1>Stockfish AI Chess · Launch screen</h1><p>The approved knight, centered on lighter blue.</p><label>Preview size <input id="scale" type="range" min="20" max="150" step="1" aria-label="Preview scale"><output id="percent"></output></label><small>iPhone 17 Pro Max layout: 440 × 956. This preview stays visible for inspection; the app won’t wait on a timer during startup.</small><div class="links"><a href="iphone-preview.html">Open chess preview</a><a href="home-icon-preview.html">Home-screen icon</a></div></section><div id="stage"><div id="launch" aria-label="Light blue launch screen with a centered chess knight"><img src="assets/branding/launch/LaunchMark.imageset/LaunchMark@3x.png" alt="Stockfish AI Chess knight"></div></div></main><script>
const slider=document.querySelector('#scale'),stage=document.querySelector('#stage'),launch=document.querySelector('#launch'),percent=document.querySelector('#percent');
let saved=87;try{saved=Number(localStorage.getItem('iphone-preview-scale'))||87;}catch{}slider.value=saved;
function resize(){const value=Number(slider.value)/100;stage.style.width=440*value+'px';stage.style.height=956*value+'px';launch.style.transform='scale('+value+')';percent.value=slider.value+'%';}
slider.addEventListener('input',resize);resize();
</script></body></html>
