name: Karsli engine research

on:
  push:
    branches: [codex/karsli-cloud-research]
    paths:
      - 'experiments/karsli/candidates/**'
      - 'experiments/karsli/tools/**'
      - 'experiments/karsli/cloud.py'
      - 'experiments/karsli/restore-network.py'
      - 'experiments/karsli/SOURCE-MANIFEST.json'
      - '.github/workflows/karsli-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karsli-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify imported candidate source
        run: python3 experiments/karsli/cloud.py --verify-only
      - name: Restore shared network
        run: python3 experiments/karsli/restore-network.py
      - name: Build, validate and run paired PZ and Tarnished comparisons
        run: python3 experiments/karsli/cloud.py --sanitizers --matches --jobs 2
      - name: Preserve logs, validation, PGN and independent replay audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: karsli-research-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            experiments/karsli/build/cloud/*.json
            experiments/karsli/build/cloud/*.pgn
            experiments/karsli/build/cloud/*.log
